version: '3.8'

services:
  carmaintenance-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=db;Database=CarMaintenanceDb;User=sa;Password=YourStrong!Passw0rd;
    depends_on:
      - db
    networks:
      - carmaintenance-network

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=YourStrong!Passw0rd
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - carmaintenance-network

volumes:
  sqlserver_data:

networks:
  carmaintenance-network:
    driver: bridge