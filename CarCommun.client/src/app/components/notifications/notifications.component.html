<div class="notifications-container">
  <div class="notifications-header">
    <h2>Notifications</h2>
    <div class="header-actions">
      <span class="unread-count" *ngIf="unreadCount > 0">
        {{ unreadCount }} unread
      </span>
      <button class="btn-mark-all" (click)="markAllAsRead()" *ngIf="unreadCount > 0">
        Mark all as read
      </button>
    </div>
  </div>

  <div class="notifications-list">
    <div *ngFor="let notification of notifications"
         class="notification-item"
         [class.unread]="!notification.isRead"
         (click)="markAsRead(notification)">

      <div class="notification-icon">
        <span [class]="getNotificationIcon(notification.type)"></span>
      </div>

      <div class="notification-content">
        <div class="notification-title">
          {{ getNotificationTitle(notification) }}
        </div>
        <div class="notification-message">
          {{ notification.payload }}
        </div>
        <div class="notification-time">
          {{ notification.createdDate | date:'short' }}
        </div>
      </div>

      <div class="notification-actions">
        <span class="unread-indicator" *ngIf="!notification.isRead"></span>
      </div>
    </div>

    <div *ngIf="notifications.length === 0" class="no-notifications">
      <p>No notifications yet</p>
    </div>
  </div>
</div>
