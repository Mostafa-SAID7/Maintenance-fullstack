<div class="feed-container">
  <div class="feed-header">
    <h2>Community Feed</h2>
    <select [(ngModel)]="selectedCategory" (change)="onCategoryChange($event.target.value)">
      <option value="general">General</option>
      <option value="jdm">JDM</option>
      <option value="classic">Classic</option>
      <option value="ev">Electric Vehicles</option>
      <option value="all">All Categories</option>
    </select>
  </div>

  <div class="posts-container">
    <app-post-form (postCreated)="onPostCreated($event)"></app-post-form>

    <div class="posts-list">
      <div *ngFor="let post of posts" class="post-card">
        <div class="post-header">
          <span class="username">{{ post.user?.userName || 'Anonymous' }}</span>
          <span class="timestamp">{{ post.createdDate | date:'short' }}</span>
        </div>
        <div class="post-content">
          <p>{{ post.content }}</p>
          <span *ngIf="post.category" class="category-badge">{{ post.category }}</span>
        </div>
        <div class="post-actions">
          <button class="btn-like">👍 Like</button>
          <button class="btn-comment">💬 Comment</button>
        </div>
      </div>
    </div>
  </div>
</div>
