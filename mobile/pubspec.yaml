name: car_maintenance_mobile
description: A Flutter app for car maintenance management with cross-platform support

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # HTTP client for API communication
  http: ^1.1.0
  dio: ^5.4.0
  # State management
  provider: ^6.0.5
  flutter_bloc: ^8.1.3
  # Local storage and offline support
  shared_preferences: ^2.2.0
  sqflite: ^2.3.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  # Data and formatting
  intl: ^0.19.0
  json_annotation: ^4.8.1
  # UI and responsive design
  flutter_svg: ^2.0.7
  cached_network_image: ^3.3.0
  pull_to_refresh: ^2.0.0
  skeletonizer: ^1.0.0
  # Device features
  device_info_plus: ^9.1.0
  connectivity_plus: ^4.0.2
  # Navigation and routing
  go_router: ^12.1.0
  # Security
  crypto: ^3.0.3
  # Platform adaptations
  adaptive_components: ^0.0.5
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  json_serializable: ^6.7.1
  build_runner: ^2.4.6
  hive_generator: ^2.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
  
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700