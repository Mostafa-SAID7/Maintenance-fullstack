name: Bug Report
description: Create a report to help us improve
title: '[BUG] '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: To Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: e.g. iOS, Windows, macOS, Linux
  - type: input
    id: device
    attributes:
      label: Device
      placeholder: e.g. iPhone12, Desktop
  - type: input
    id: browser
    attributes:
      label: Browser
      placeholder: e.g. chrome, safari
  - type: textarea
    id: additional_context
    attributes:
      label: Additional context
      description: Add any other context about the problem here.
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - Low (Minor issue, doesn't affect core functionality)
        - Medium (Affects some functionality)
        - High (Blocks critical functionality)
        - Critical (System down, data loss)
    validations:
      required: true
