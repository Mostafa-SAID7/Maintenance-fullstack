name: Build and Deploy

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  DOTNET_VERSION: '9.0.x'
  NODE_VERSION: '20.x'

jobs:
  # Backend .NET Build and Test
  backend-build:
    name: Backend Build & Test (.NET)
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: nuget-packages-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          nuget-packages-${{ runner.os }}-

    - name: Restore dependencies
      run: dotnet restore CarCommun.sln

    - name: Build solution
      run: dotnet build CarCommun.sln --configuration Release --no-restore

    - name: Run tests
      run: dotnet test CarCommun.sln --configuration Release --no-restore --verbosity normal --collect:"XPlat Code Coverage" -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-backend
        path: |
          **/TestResults/*.trx
          **/TestResults/*.xml

  # Frontend Build and Test
  frontend-build:
    name: Frontend Build & Test
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: ClientApp/package-lock.json

    - name: Install dependencies
      working-directory: ./ClientApp
      run: npm ci

    - name: Run linting
      working-directory: ./ClientApp
      run: npm run lint || echo "Linting not configured, skipping"

    - name: Run unit tests
      working-directory: ./ClientApp
      run: npm run test:ci || echo "Tests not configured, skipping"

    - name: Build production
      working-directory: ./ClientApp
      run: npm run build:prod || npm run build

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: frontend-build
        path: ClientApp/dist/

  # Security Scan
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [backend-build]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run CodeQL Analysis
      uses: github/codeql-action/init@v3
      with:
        languages: csharp, javascript

    - name: Autobuild
      uses: github/codeql-action/autobuild@v3

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3

  # Docker Build and Push
  docker-build:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [backend-build, frontend-build]
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Check if API Dockerfile exists
      id: check_api_dockerfile
      run: |
        if [ -f "src/CarMaintenance.Api/Dockerfile" ]; then
          echo "exists=true" >> $GITHUB_OUTPUT
        else
          echo "exists=false" >> $GITHUB_OUTPUT
          echo "API Dockerfile not found"
        fi

    - name: Build and push API
      if: steps.check_api_dockerfile.outputs.exists == 'true'
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./src/CarMaintenance.Api/Dockerfile
        push: true
        tags: ghcr.io/${{ github.repository_owner }}/carmaintenance-api:${{ github.sha }}
        platforms: linux/amd64,linux/arm64

    - name: Check if Frontend Dockerfile exists
      id: check_frontend_dockerfile
      run: |
        if [ -f "ClientApp/Dockerfile" ]; then
          echo "exists=true" >> $GITHUB_OUTPUT
        else
          echo "exists=false" >> $GITHUB_OUTPUT
          echo "Frontend Dockerfile not found"
        fi

    - name: Build and push Frontend
      if: steps.check_frontend_dockerfile.outputs.exists == 'true'
      uses: docker/build-push-action@v5
      with:
        context: ./ClientApp
        file: ./ClientApp/Dockerfile
        push: true
        tags: ghcr.io/${{ github.repository_owner }}/carmaintenance-frontend:${{ github.sha }}

  # Deploy to Staging
  deploy-staging:
    name: Deploy to Staging Environment
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.ref == 'refs/heads/develop'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy to Staging
      run: |
        echo "Deploying to staging environment..."
        # Check if deployment scripts exist
        if [ -f "scripts/deploy-staging.sh" ]; then
          chmod +x scripts/deploy-staging.sh
          ./scripts/deploy-staging.sh
        elif [ -f "k8s/staging/deployment.yaml" ]; then
          kubectl apply -f k8s/staging/ || echo "kubectl not available or k8s deployment failed"
        else
          echo "No staging deployment script found. Please add scripts/deploy-staging.sh or k8s/staging/deployment.yaml"
        fi
      env:
        STAGING_API_URL: ${{ secrets.STAGING_API_URL || '' }}
        STAGING_DB_CONNECTION: ${{ secrets.STAGING_DB_CONNECTION || '' }}

  # Deploy to Production
  deploy-production:
    name: Deploy to Production Environment
    runs-on: ubuntu-latest
    needs: [docker-build, security-scan]
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy to Production
      run: |
        echo "Deploying to production environment..."
        # Check if deployment scripts exist
        if [ -f "scripts/deploy-production.sh" ]; then
          chmod +x scripts/deploy-production.sh
          ./scripts/deploy-production.sh
        elif [ -f "k8s/production/deployment.yaml" ]; then
          kubectl apply -f k8s/production/ || echo "kubectl not available or k8s deployment failed"
        else
          echo "No production deployment script found. Please add scripts/deploy-production.sh or k8s/production/deployment.yaml"
        fi
      env:
        PRODUCTION_API_URL: ${{ secrets.PRODUCTION_API_URL || '' }}
        PRODUCTION_DB_CONNECTION: ${{ secrets.PRODUCTION_DB_CONNECTION || '' }}

    - name: Notify deployment
      if: always()
      uses: 8398a7/action-slack@v3
      with:
        status: ${{ job.status }}
        text: "Car Maintenance API deployed to production environment"
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK || secrets.SLACK_WEBHOOK_URL || '' }}
      continue-on-error: true