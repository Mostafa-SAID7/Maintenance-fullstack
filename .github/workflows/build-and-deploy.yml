name: Build and Deploy

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  DOTNET_VERSION: '9.0.x'
  NODE_VERSION: '20.x'
  FLUTTER_VERSION: '3.19.x'

jobs:
  # Backend .NET Build and Test
  backend-build:
    name: Backend Build & Test (.NET)
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: nuget-packages-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          nuget-packages-${{ runner.os }}-

    - name: Restore dependencies
      run: dotnet restore CarCommun.sln

    - name: Build solution
      run: dotnet build CarCommun.sln --configuration Release --no-restore

    - name: Run tests
      run: dotnet test CarCommun.sln --configuration Release --no-restore --verbosity normal --collect:"XPlat Code Coverage" -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-backend
        path: |
          **/TestResults/*.trx
          **/TestResults/*.xml

  # Frontend Angular Build and Test
  frontend-build:
    name: Frontend Build & Test (Angular)
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: ClientApp/package-lock.json

    - name: Install dependencies
      working-directory: ./ClientApp
      run: npm ci

    - name: Run linting
      working-directory: ./ClientApp
      run: npm run lint

    - name: Run unit tests
      working-directory: ./ClientApp
      run: npm run test:ci

    - name: Build production
      working-directory: ./ClientApp
      run: npm run build:prod

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: frontend-build
        path: ClientApp/dist/

  # Mobile Flutter Build and Test
  mobile-build:
    name: Mobile Build & Test (Flutter)
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'microsoft'
        java-version: '17'

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}

    - name: Get Flutter packages
      working-directory: ./mobile
      run: flutter pub get

    - name: Run Flutter tests
      working-directory: ./mobile
      run: flutter test --coverage

    - name: Build APK
      working-directory: ./mobile
      run: flutter build apk --release

    - name: Build iOS (if possible)
      working-directory: ./mobile
      run: |
        # iOS build would require macOS runner and Apple Developer account
        # flutter build ios --release --no-codesign
        echo "iOS build skipped - requires macOS runner"

    - name: Upload mobile artifacts
      uses: actions/upload-artifact@v4
      with:
        name: mobile-build
        path: mobile/build/app/outputs/flutter-apk/app-release.apk

  # Security Scan
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [backend-build]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run OWASP ZAP Baseline Scan
      uses: zaproxy/action-baseline@v0.12.0
      with:
        target: 'https://example.com' # Replace with your staging URL
        rules_file_name: '.zap/rules.tsv'
        cmd_options: '-a'

    - name: Run CodeQL Analysis
      uses: github/codeql-action/init@v3
      with:
        languages: csharp, javascript, dart

    - name: Autobuild
      uses: github/codeql-action/autobuild@v3

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3

  # Docker Build and Push
  docker-build:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [backend-build, frontend-build]
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push API
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./src/CarMaintenance.Api/Dockerfile
        push: true
        tags: ghcr.io/${{ github.repository_owner }}/carmaintenance-api:${{ github.sha }}
        platforms: linux/amd64,linux/arm64

    - name: Build and push Frontend
      uses: docker/build-push-action@v5
      with:
        context: ./ClientApp
        file: ./ClientApp/Dockerfile
        push: true
        tags: ghcr.io/${{ github.repository_owner }}/carmaintenance-frontend:${{ github.sha }}

  # Deploy to Staging
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.ref == 'refs/heads/develop'
    environment: staging
    
    steps:
    - name: Deploy to Staging
      run: |
        echo "Deploying to staging environment..."
        # Add your staging deployment script here
        # kubectl apply -f k8s/staging/ || echo "K8s deployment script not found"

  # Deploy to Production
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [docker-build, security-scan]
    if: github.ref == 'refs/heads/main'
    environment: production
    
    steps:
    - name: Deploy to Production
      run: |
        echo "Deploying to production environment..."
        # Add your production deployment script here
        # kubectl apply -f k8s/production/ || echo "K8s deployment script not found"

    - name: Notify deployment
      uses: 8398a7/action-slack@v3
      with:
        status: ${{ job.status }}
        text: "Car Maintenance API deployed to production"
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
      if: always()